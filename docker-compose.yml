version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: blog_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - blog_network

  backend:
    build:
      context: ./blog-backend
      dockerfile: Dockerfile
    container_name: blog_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://root:password123@mongodb:27017/blog_db?authSource=admin
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - blog_network
    volumes:
      - ./blog-backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile
    container_name: blog_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - blog_network
    volumes:
      - ./blog-frontend:/app
      - /app/node_modules

volumes:
  mongo_data:

networks:
  blog_network:
    driver: bridge
